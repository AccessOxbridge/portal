# Session Reminders Cron
# - Runs every 15 minutes on the default branch (e.g. main). Scheduled runs use the workflow file from the default branch.
# - Required GitHub Actions secrets: SITE_URL (e.g. https://your-app.vercel.app), CRON_SECRET (must match the app env).
# - SITE_URL controls which app is hit: set to dev URL for dev, prod URL for prod. No code change needed to switch.

name: Session Reminders Cron

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Reminder Endpoint
        run: |
          curl -X GET "${{ secrets.SITE_URL }}/api/cron/reminders" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -f
        # The -f flag ensures the action fails if the response is 4xx or 5xx
